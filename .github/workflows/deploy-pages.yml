# Cloudflare Pages 배포 (선택). Cloudflare 대시보드에서 GitHub 저장소를 직접 연결했다면 이 워크플로는 필요 없습니다.
# 사용 시 저장소 Secrets에 CLOUDFLARE_API_TOKEN(Pages 편집 권한), CLOUDFLARE_ACCOUNT_ID 를 등록하세요.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=carouselstudio --branch=master
