async function renderPNG(i){

  const el=buildSlide(state.slides[i],i,false);host.appendChild(el);document.body.appendChild(host);

  $('#pTitle').textContent=title;document.title=title+' · 캐러셀 스튜디오';setStat(code?'':'미저장');if(code){history.replaceState(null,'',`?p=${code}`);try{localStorage.setItem(KEY+':code',code);}catch(e){}}renderAll();}
async function openProject(code,silent){try{const r=await store.get(code);if(!r){if(!silent)alert('프로젝트를 찾을 수 없습니다.');return false;}useProject(r.code,r.title,r.data);closeHome();toast(`"${r.title}" 열림`);return true;}catch(err){alert('불러오기 실패: '+(err.message||err));return false;}}
async function newProject(fromTemplate){if(dirty&&!confirm('저장하지 않은 변경이 있습니다. 새 프로젝트를 만들까요?'))return;
  const title=prompt('프로젝트 이름',fromTemplate?'게더 올 어라운드 팀 모집':'새 캐러셀');if(title===null)return;
  const data=fromTemplate?fresh():{size:{w:1080,h:1350},fonts:[],slides:[{id:'S'+uid(),photo:'',px:50,py:50,zoom:100,sh:55,shA:92,bg:'#14110E',pager:true,layers:[]}]};
  useProject(null,title.trim()||'제목 없음',data);closeHome();await saveProject(true);toast('새 프로젝트 생성');}
async function copyProject(code,title){try{const r=await store.get(code);if(!r)return;const c=newCode();const t=prompt('복사본 이름',title+' (복사본)');if(t===null)return;
  await store.put({code:c,title:t.trim()||title,data:r.data,slide_count:r.slide_count,thumb:r.thumb,updated_at:new Date().toISOString()});toast('복사됨');renderHome();}catch(err){alert('복사 실패: '+(err.message||err));}}
async function renameProject(code,title){const t=prompt('새 이름',title);if(t===null||!t.trim())return;try{if(code===proj.code){proj.title=t.trim();$('#pTitle').textContent=proj.title;}
  const r=await store.get(code);if(r){await store.put({...r,title:t.trim(),updated_at:new Date().toISOString()});}renderHome();}catch(err){alert('이름 변경 실패: '+(err.message||err));}}
async function deleteProject(code,title){if(!confirm(`"${title}" 프로젝트를 삭제할까요? 되돌릴 수 없습니다.`))return;try{await store.del(code);if(code===proj.code){proj.code=null;setStat('미저장');history.replaceState(null,'','?');}toast('삭제됨');renderHome();}catch(err){alert('삭제 실패: '+(err.message||err));}}
async function renderHome(){const P=$('#plist');P.innerHTML='<div class="empty">불러오는 중…</div>';$('#homeStat').textContent=sb?'☁ 클라우드(Supabase)':'이 브라우저에만 저장됨';
  try{const rows=await store.list();if(!rows.length){P.innerHTML='<div class="empty">아직 프로젝트가 없어요. 위 버튼으로 새 프로젝트를 만드세요.</div>';return;}
    P.innerHTML=rows.map(r=>`<div class="pc ${r.code===proj.code?'cur':''}" data-code="${r.code}"><div class="th" style="${r.thumb?`background-image:url(${r.thumb})`:''}">${r.thumb?'':'미리보기 없음'}</div><div class="pb"><div class="pt" title="${esc(r.title)}">${esc(r.title)||'제목 없음'}</div><div class="pm">${r.slide_count||'?'}장 · ${new Date(r.updated_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} · ${r.code}</div><div class="pa"><button data-a="open">열기</button><button data-a="copy">복사</button><button data-a="ren">이름</button><button data-a="del" class="danger">삭제</button></div></div></div>`).join('');
    P.querySelectorAll('.pc').forEach(c=>{const code=c.dataset.code,title=c.querySelector('.pt').textContent;c.onclick=e=>{const a=e.target.dataset.a;
      if(a==='copy')return copyProject(code,title);if(a==='ren')return renameProject(code,title);if(a==='del')return deleteProject(code,title);
      if(dirty&&code!==proj.code&&!confirm('저장하지 않은 변경이 있습니다. 다른 프로젝트를 열까요?'))return;if(code===proj.code){closeHome();return;}openProject(code);};});}
  catch(err){P.innerHTML=`<div class="empty">목록을 불러오지 못했습니다: ${err.message||err}<br>Supabase 테이블(carousel_projects)과 config.js 설정을 확인해 주세요.</div>`;}}
function openHome(){$('#home').hidden=false;renderHome();}function closeHome(){$('#home').hidden=true;}
$('#bHome').onclick=openHome;$('#hClose').onclick=()=>{if(proj.code||state.slides.length)closeHome();};
$('#hNewT').onclick=()=>newProject(true);$('#hNewB').onclick=()=>newProject(false);
$('#bSave').onclick=()=>saveProject(false);$('#pTitle').onclick=()=>{if(!proj.code){const t=prompt('프로젝트 이름',proj.title);if(t&&t.trim()){proj.title=t.trim();$('#pTitle').textContent=proj.title;}return;}renameProject(proj.code,proj.title);};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject(false);}});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
/* ---------- boot ---------- */
function renderAll(){$('#selSize').value=`${W()}x${H()}`;renderLeft();renderStage();renderRight();}
const _commit=commit;commit=function(){_commit();markDirty();};
(async()=>{
  ensureFont('body');state=fresh();registerFonts();hist=[snap()];hptr=0;
  await document.fonts.ready.catch(()=>{});
  let code=null;try{code=new URL(location.href).searchParams.get('p')||localStorage.getItem(KEY+':code');}catch(e){}
  if(code&&await openProject(code.toUpperCase(),true))return;
  try{localStorage.removeItem(KEY+':code');}catch(e){}
  useProject(null,'제목 없음',fresh());openHome();
})();
</script></body></html>
