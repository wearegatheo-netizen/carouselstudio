<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
{{FONTFACES}}
:root{--paper:#F5EFE4;--amber:#F0A83B;--amber2:#FFD27A;--muted:#B8AC98;--line:rgba(245,239,228,.16);--ui:#1B1815;--ui2:#26221D;--ui3:#332E27;--bg:#0F0D0B}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ui2);cursor:pointer;font-weight:600;white-space:nowrap}
button:hover{background:var(--ui3)}button.primary{background:var(--amber);border-color:var(--amber);color:#1a1408}button.primary:hover{background:var(--amber2)}
button.danger{color:#ff8a7a}button:disabled{opacity:.45;cursor:default}
button.on{background:var(--amber);color:#1a1408;border-color:var(--amber)}
button.ic{padding:5px 8px;font-size:12px}
select,input[type=number],input[type=text]{background:var(--ui);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:none}
header{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--ui);flex:none;flex-wrap:wrap}
header h1{font-family:KkuBulLim;font-weight:400;font-size:21px;color:var(--amber2);margin-right:auto}
header .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
header .msg{font-size:12px;color:var(--muted);width:100%}
main{flex:1;display:grid;grid-template-columns:190px 1fr 310px;min-height:0}
aside{background:var(--ui);border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
aside.right{border-right:0;border-left:1px solid var(--line)}
.thumb{border:2px solid transparent;border-radius:10px;padding:5px;background:var(--ui2);cursor:pointer;display:flex;flex-direction:column;gap:5px}
.thumb.sel{border-color:var(--amber)}
.thumb .pv{width:100%;overflow:hidden;border-radius:6px;position:relative;background:#000;pointer-events:none}
.thumb .pv .slide{transform-origin:top left;position:absolute;left:0;top:0}
.thumb .tb{display:flex;gap:3px;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.thumb .tb button{padding:2px 5px;font-size:12px}
.canvasWrap{position:relative;overflow:auto;background:#0a0908;display:grid;place-items:center;padding:24px}
#stage{position:relative;transform-origin:top left;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.zoombar{position:absolute;right:14px;bottom:12px;display:flex;gap:4px;align-items:center;background:rgba(27,24,21,.9);border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;color:var(--muted)}
.zoombar button{padding:2px 8px;border-radius:999px}
.slide{position:relative;overflow:hidden;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.slide .bg{position:absolute;inset:0;background-size:cover}
.slide .shade{position:absolute;inset:0}
.slide .pager{position:absolute;right:80px;bottom:76px;display:flex;gap:10px}.slide .pager i{width:12px;height:12px;border-radius:50%;background:rgba(245,239,228,.18)}.slide .pager i.on{background:#F0A83B}
.layer{position:absolute;box-sizing:border-box}
.layer .tx{outline:none;word-break:keep-all;overflow-wrap:break-word}
.layer .tx em{font-style:normal;color:var(--accent,#F0A83B)}.layer .tx b,.layer .tx strong{font-weight:700}.layer .tx small{font-size:.78em;color:#B8AC98}.layer .tx u{text-decoration:underline}
.layer.image img{width:100%;height:100%;display:block}
#stage .layer{cursor:move}
#stage .layer.locked{cursor:default}
#stage .layer:hover{outline:1.5px dashed rgba(240,168,59,.6)}
#stage .layer.sel{outline:2px solid #F0A83B}
#stage .layer.editing{cursor:text;outline:2px solid #FFD27A}
#stage .layer .hd{position:absolute;width:14px;height:14px;background:#F0A83B;border:2px solid #14110E;border-radius:3px;z-index:3}
#stage .layer .hd.e{right:-8px;top:50%;margin-top:-7px;cursor:ew-resize}
#stage .layer .hd.se{right:-8px;bottom:-8px;cursor:nwse-resize}
#stage .layer .hd.rot{left:50%;top:-34px;margin-left:-7px;border-radius:50%;cursor:grab}
#stage .guide{position:absolute;background:#4FC3F7;pointer-events:none;z-index:5}
#stage .guide.v{width:2px;top:0;bottom:0}#stage .guide.h{height:2px;left:0;right:0}
.sec{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:7px}
.sec h3{font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.f{display:grid;grid-template-columns:72px 1fr;gap:6px;align-items:center;color:var(--muted)}
.f.inline{grid-template-columns:72px auto 1fr;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.g2 .f,.g3 .f{grid-template-columns:1fr;gap:2px}.g2 .f>span,.g3 .f>span{font-size:11px}
.sw{display:flex;gap:5px;flex-wrap:wrap}.sw i{width:19px;height:19px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;display:block}
.seg{display:flex;gap:3px}.seg button{flex:1;padding:6px 3px}
.empty{color:var(--muted);line-height:1.6}
kbd{background:var(--ui3);border-radius:4px;padding:1px 5px;font-size:11px}
.lyr{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12px}
.lyr:hover{background:var(--ui2)}.lyr.sel{background:var(--ui3);outline:1px solid var(--amber)}
.lyr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lyr .t{color:var(--muted);font-size:11px;width:28px}
.lyr button{padding:1px 5px;font-size:11px;background:none;border-color:transparent}.lyr button.off{opacity:.35}
.fmt{display:flex;gap:3px}.fmt button{flex:1;padding:6px 2px;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--amber);color:#1a1408;padding:9px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
@media (max-width:900px){main{grid-template-columns:1fr}aside{display:none}}
</style></head><body>
<header>
 <h1>Gather All Around · 캐러셀 스튜디오</h1>
 <button id="bUndo" class="ic" title="Ctrl+Z">↶</button><button id="bRedo" class="ic" title="Ctrl+Y">↷</button>
 <span class="sep"></span>
 <select id="selSize" style="width:auto" title="캔버스 크기"><option value="1080x1350">4:5 피드 1080×1350</option><option value="1080x1080">1:1 정사각 1080×1080</option><option value="1080x1920">9:16 스토리 1080×1920</option></select>

 <span class="sep"></span>

 <button id="bCloudSave" title="Supabase에 저장">☁ 클라우드 저장</button><button id="bCloudOpen">☁ 열기</button><span id="cloudCode" style="font-size:12px;color:var(--muted)"></span>
 <button id="bReset" class="danger">초기화</button>
 <div class="msg">요소 <b>클릭 → 드래그</b> 이동(가운데·여백선에 자동 스냅), <b>더블클릭</b> 문구 수정, 손잡이로 폭·회전. <kbd>Del</kbd> 삭제 · <kbd>←↑↓→</kbd> 이동(<kbd>Shift</kbd> 10px) · <kbd>Ctrl+C/V</kbd> 복사·붙여넣기(다른 장에도) · <kbd>Ctrl+D</kbd> 복제 · <kbd>Ctrl+Z</kbd> 되돌리기 · <kbd>Esc</kbd> 선택 해제</div>
</header>
<main>
 <aside id="left"></aside>
 <div class="canvasWrap" id="wrap"><div id="stage"></div><div class="zoombar"><button id="zOut">−</button><span id="zLbl">100%</span><button id="zIn">＋</button><button id="zFit">맞춤</button></div></div>
 <aside class="right" id="right"></aside>
</main>
<div id="toast"></div>
<input type="file" id="fPhoto" accept="image/*" hidden><input type="file" id="fImg" accept="image/*" hidden><input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2" hidden>
<script>
const ASSETS={{ASSETS}};
const TEMPLATE={{TEMPLATE}};
const KEY='gaa-studio-v2';
const BUILTIN_FONTS=[{key:'display',label:'꾸불림 (손글씨)',css:"KkuBulLim,'Noto Sans KR',sans-serif"},{key:'body',label:'고딕 (Noto Sans KR / 맑은 고딕)',css:"'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"},{key:'serif',label:'명조 (Noto Serif KR / 바탕)',css:"'Noto Serif KR','Nanum Myeongjo','Batang','Apple Myungjo',serif"},{key:'round',label:'둥근고딕',css:"'NanumSquareRound','Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif"},{key:'mono',label:'고정폭',css:"'D2Coding','Consolas','Menlo',monospace"}];
const SWATCH=['#F5EFE4','#FFD27A','#F0A83B','#B8AC98','#E8DFCF','#14110E','#FFFFFF','#3366FF','#E74C3C','#2ECC71','#9B59B6','#1ABC9C'];
let state, cur=0, selId=null, editingId=null, hist=[], hptr=-1, clip=null, zoom=null;
const $=(s,r=document)=>r.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>'L'+Math.random().toString(36).slice(2,8);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function fresh(){return {size:{w:1080,h:1350},slides:clone(TEMPLATE).map(s=>({...s,layers:s.layers.map(l=>({...l,radius:(l.type==='text'&&l.bgA===0&&l.borderW===0)?0:l.radius}))})),fonts:[]};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.slides&&s.slides.length){state=s;state.size=state.size||{w:1080,h:1350};state.fonts=state.fonts||[];return;}}catch(e){}state=fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){$('header .msg').textContent='⚠ 사진 용량이 커서 브라우저 자동 저장이 되지 않습니다. [작업 파일] 또는 [☁ 클라우드 저장]으로 보관해 주세요.';}}
function snap(){return JSON.stringify({slides:state.slides,size:state.size});}
function commit(){hist=hist.slice(0,hptr+1);hist.push(snap());if(hist.length>100)hist.shift();hptr=hist.length-1;save();}
function restore(j){const o=JSON.parse(j);state.slides=o.slides;state.size=o.size;cur=Math.min(cur,state.slides.length-1);selId=null;editingId=null;save();renderAll();}
function undo(){if(hptr<=0)return;hptr--;restore(hist[hptr]);}
function redo(){if(hptr>=hist.length-1)return;hptr++;restore(hist[hptr]);}
const slide=()=>state.slides[cur]; const sel=()=>slide().layers.find(l=>l.id===selId);
const W=()=>state.size.w, H=()=>state.size.h;
function fontCss(k){if(k&&k.startsWith('custom:')){return `"${k.slice(7)}",'Noto Sans KR',sans-serif`;}return (BUILTIN_FONTS.find(f=>f.key===k)||BUILTIN_FONTS[1]).css;}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${(a??100)/100})`;}
function photoSrc(p){return p&&p.startsWith('@')?ASSETS[p.slice(1)]:p;}
function registerFonts(){state.fonts.forEach(f=>{if(document.fonts.check(`12px "${f.name}"`))return;const ff=new FontFace(f.name,`url(${f.data})`);ff.load().then(x=>document.fonts.add(x)).catch(()=>{});});}
function readImage(file,max,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const png=/png|gif|webp/.test(file.type);cb(c.toDataURL(png?'image/png':'image/jpeg',.88),c.width,c.height);};im.src=rd.result;};rd.readAsDataURL(file);}
/* ---------- render ---------- */
function buildSlide(s,idx,edit){
  const el=document.createElement('section');el.className='slide';el.style.width=W()+'px';el.style.height=H()+'px';el.style.background=s.bg;
  const bg=document.createElement('div');bg.className='bg';const src=photoSrc(s.photo);if(src)bg.style.backgroundImage=`url("${src}")`;bg.style.backgroundPosition=`${s.px}% ${s.py}%`;if(s.zoom&&s.zoom!==100)bg.style.backgroundSize=`${s.zoom}% auto`;el.appendChild(bg);
  const sh=document.createElement('div');sh.className='shade';const c=s.bg,a=(s.shA??92)/100;
  sh.style.background=`linear-gradient(180deg,${rgba(c,4)} 0%,${rgba(c,Math.round(a*33))} ${Math.max(0,s.sh-30)}%,${rgba(c,Math.round(a*100))} ${s.sh}%,${c} ${Math.min(100,s.sh+20)}%)`;el.appendChild(sh);
  s.layers.forEach(l=>{if(l.hidden&&!edit)return;el.appendChild(buildLayer(l,edit));});
  if(s.pager){const pg=document.createElement('div');pg.className='pager';state.slides.forEach((_,i)=>{const d=document.createElement('i');if(i===idx)d.className='on';pg.appendChild(d);});el.appendChild(pg);}
  return el;
}
function buildLayer(l,edit){
  const d=document.createElement('div');d.className='layer '+l.type+(l.lock?' locked':'');d.dataset.id=l.id;
  d.style.left=l.x+'px';d.style.top=l.y+'px';d.style.width=l.w+'px';
  if(l.rot)d.style.transform=`rotate(${l.rot}deg)`;
  if(l.opacity!=null&&l.opacity<100)d.style.opacity=l.opacity/100;
  if(l.hidden&&edit)d.style.opacity=.25;
  if(l.type==='box'){d.style.height=l.h+'px';d.style.background=rgba(l.fill,l.fillA);d.style.border=l.borderW?`${l.borderW}px solid ${rgba(l.border,l.borderA)}`:'none';d.style.borderRadius=l.radius+'px';}
  else if(l.type==='image'){d.style.height=l.h+'px';d.style.borderRadius=l.radius+'px';d.style.overflow='hidden';if(l.borderW>0)d.style.border=`${l.borderW}px solid ${rgba(l.border,l.borderA)}`;const im=document.createElement('img');im.src=l.src;im.style.objectFit=l.fit||'cover';im.draggable=false;d.appendChild(im);}
  else{
    d.style.fontFamily=fontCss(l.font);d.style.fontSize=l.size+'px';d.style.fontWeight=l.weight;d.style.color=l.color;d.style.setProperty('--accent',l.accent||'#F0A83B');d.style.textAlign=l.align;d.style.lineHeight=l.lh;d.style.letterSpacing=l.ls+'em';
    if(l.italic)d.style.fontStyle='italic';if(l.upper)d.style.textTransform='uppercase';
    if(l.shadow)d.style.textShadow=`0 ${Math.round(l.size*.06)}px ${Math.round(l.size*.18)}px rgba(0,0,0,.65)`;
    if(l.bgA>0)d.style.background=rgba(l.bg,l.bgA);if(l.borderW>0)d.style.border=`${l.borderW}px solid ${rgba(l.border,l.borderA)}`;d.style.borderRadius=l.radius+'px';d.style.padding=`${l.pad}px ${l.padX}px`;
    const tx=document.createElement('div');tx.className='tx';tx.innerHTML=l.html;d.appendChild(tx);
  }
  if(edit&&l.id===selId&&!l.lock){d.classList.add('sel');const h=document.createElement('div');h.className='hd '+(l.type==='text'?'e':'se');d.appendChild(h);const r=document.createElement('div');r.className='hd rot';r.title='드래그해서 회전';d.appendChild(r);}
  return d;
}
/* ---------- left ---------- */
function renderLeft(){
  const L=$('#left');L.innerHTML='';
  state.slides.forEach((s,i)=>{
    const t=document.createElement('div');t.className='thumb'+(i===cur?' sel':'');
    const pv=document.createElement('div');pv.className='pv';pv.style.aspectRatio=`${W()}/${H()}`;pv.appendChild(buildSlide(s,i,false));t.appendChild(pv);
    const tb=document.createElement('div');tb.className='tb';tb.innerHTML=`<span>${i+1}</span><span><button data-a="up" title="앞으로">↑</button><button data-a="dn" title="뒤로">↓</button><button data-a="dup" title="복제">⧉</button><button data-a="del" title="삭제" class="danger">✕</button></span>`;t.appendChild(tb);
    t.onclick=e=>{const a=e.target.dataset.a;if(!a){cur=i;selId=null;renderAll();return;}
      if(a==='up'&&i>0){[state.slides[i-1],state.slides[i]]=[state.slides[i],state.slides[i-1]];cur=i-1;}
      if(a==='dn'&&i<state.slides.length-1){[state.slides[i+1],state.slides[i]]=[state.slides[i],state.slides[i+1]];cur=i+1;}
      if(a==='dup'){const c=clone(s);c.id='S'+uid();c.layers.forEach(l=>l.id=uid());state.slides.splice(i+1,0,c);cur=i+1;}
      if(a==='del'){if(state.slides.length===1){toast('마지막 장은 삭제할 수 없어요');return;}if(!confirm(`${i+1}번 장을 삭제할까요?`))return;state.slides.splice(i,1);cur=Math.min(i,state.slides.length-1);}
      selId=null;commit();renderAll();};
    L.appendChild(t);
  });
  const add=document.createElement('button');add.textContent='＋ 새 슬라이드';add.onclick=()=>{state.slides.push({id:'S'+uid(),photo:'',px:50,py:50,zoom:100,sh:55,shA:92,bg:'#14110E',pager:true,layers:[{...TXT(),html:'새 문구를 입력하세요',font:'display',size:84,weight:400,lh:1.05,y:Math.round(H()*.45)}]});cur=state.slides.length-1;selId=null;commit();renderAll();};
  L.appendChild(add);
  requestAnimationFrame(()=>L.querySelectorAll('.pv').forEach(pv=>{pv.firstChild.style.transform=`scale(${pv.clientWidth/W()})`;}));
}
/* ---------- canvas ---------- */
let scale=1;
function fitScale(){const wrap=$('#wrap');return Math.min((wrap.clientWidth-48)/W(),(wrap.clientHeight-48)/H());}
function renderStage(){
  const st=$('#stage');st.innerHTML='';st.appendChild(buildSlide(slide(),cur,true));
  scale=zoom||fitScale();
  st.style.width=W()+'px';st.style.height=H()+'px';st.style.transform=`scale(${scale})`;
  st.style.marginRight=(W()*scale-W())+'px';st.style.marginBottom=(H()*scale-H())+'px';
  $('#zLbl').textContent=Math.round(scale*100)+'%';
  if(editingId){const el=st.querySelector(`.layer[data-id="${editingId}"] .tx`);if(el){el.contentEditable='true';el.parentElement.classList.add('editing');el.focus();}}
}
addEventListener('resize',()=>renderStage());
$('#zIn').onclick=()=>{zoom=Math.min(2,(zoom||fitScale())+.1);renderStage();};
$('#zOut').onclick=()=>{zoom=Math.max(.1,(zoom||fitScale())-.1);renderStage();};
$('#zFit').onclick=()=>{zoom=null;renderStage();};
$('#wrap').addEventListener('pointerdown',e=>{if(e.target.id!=='wrap')return;if(editingId)stopEdit();if(selId){selId=null;renderStage();renderRight();}});
const stage=$('#stage');
function guides(list){stage.querySelectorAll('.guide').forEach(g=>g.remove());list.forEach(g=>{const d=document.createElement('div');d.className='guide '+g.d;if(g.d==='v')d.style.left=g.v+'px';else d.style.top=g.v+'px';stage.appendChild(d);});}
stage.addEventListener('pointerdown',e=>{
  const ly=e.target.closest('.layer');
  if(editingId){ if(ly&&ly.dataset.id===editingId) return; stopEdit(); }
  if(!ly){selId=null;renderStage();renderRight();return;}
  const id=ly.dataset.id;if(selId!==id){selId=id;renderStage();renderRight();}
  const l=sel();if(l.lock)return;
  const cls=e.target.classList;const isW=cls.contains('hd')&&!cls.contains('rot'),isR=cls.contains('rot');
  const sx=e.clientX,sy=e.clientY,ox=l.x,oy=l.y,ow=l.w,oh=l.h||0,orot=l.rot||0;let moved=false;
  const el=stage.querySelector(`.layer[data-id="${id}"]`);const eh=el.offsetHeight;
  const cx0=()=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};const [ccx,ccy]=cx0();

$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
$('#selSize').onchange=e=>{const [w,h]=e.target.value.split('x').map(Number);const oh=H();state.size={w,h};
  state.slides.forEach(s=>s.layers.forEach(l=>{if(l.y>oh*0.5)l.y=Math.round(l.y+(h-oh));}));zoom=null;commit();renderAll();toast(`캔버스 ${w}×${h} — 아래쪽 요소는 새 하단에 맞춰 이동했어요`);};
/* ---------- export ---------- */
async function renderPNG(i){
  const host=document.createElement('div');host.style.cssText=`position:fixed;left:0;top:0;width:${W()}px;height:${H()}px;overflow:hidden;z-index:-1;opacity:0;pointer-events:none`;
  const el=buildSlide(state.slides[i],i,false);host.appendChild(el);document.body.appendChild(host);
  await document.fonts.ready;await new Promise(r=>setTimeout(r,60));
  const canvas=await html2canvas(el,{width:W(),height:H(),scale:1,backgroundColor:state.slides[i].bg,logging:false});
  host.remove();return canvas;
}
function saveCanvas(c,name){const jpg=$('#selFmt').value==='jpg';const a=document.createElement('a');a.download=name+(jpg?'.jpg':'.png');a.href=jpg?c.toDataURL('image/jpeg',.92):c.toDataURL('image/png');a.click();}
const fname=i=>`gaa-carousel-${String(i+1).padStart(2,'0')}`;
$('#bPng').onclick=async e=>{const b=e.target;b.disabled=true;try{saveCanvas(await renderPNG(cur),fname(cur));toast('저장됨');}catch(err){alert('이미지를 만들지 못했습니다: '+err.message);}b.disabled=false;};
$('#bPngAll').onclick=async e=>{const b=e.target;b.disabled=true;const t=b.textContent;try{for(let i=0;i<state.slides.length;i++){b.textContent=`${i+1}/${state.slides.length}…`;saveCanvas(await renderPNG(i),fname(i));await new Promise(r=>setTimeout(r,700));}toast(`${state.slides.length}장 저장됨`);}catch(err){alert('이미지를 만들지 못했습니다: '+err.message);}b.disabled=false;b.textContent=t;};
/* ---------- cloud (Supabase) ---------- */
const CFG=window.CAROUSEL_CONFIG||{};let sb=null;
try{if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase)sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);}catch(e){console.error(e);}
const TABLE=CFG.table||'carousel_projects';
let cloudCode=null;try{cloudCode=new URL(location.href).searchParams.get('p')||localStorage.getItem(KEY+':code');}catch(e){}
function showCode(){$('#cloudCode').textContent=cloudCode?`코드 ${cloudCode}`:'';if(!sb){$('#bCloudSave').disabled=$('#bCloudOpen').disabled=true;$('#bCloudSave').title='config.js에 Supabase 설정이 없거나 supabase-js를 불러오지 못했습니다';}}
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
async function cloudSave(){if(!sb)return;const b=$('#bCloudSave');b.disabled=true;try{
  if(!cloudCode)cloudCode=newCode();
  const title=(state.slides[0].layers.find(l=>l.type==='text'&&l.size>=60)||{}).html?.replace(/<[^>]+>/g,' ').trim().slice(0,60)||'캐러셀';
  const {error}=await sb.from(TABLE).upsert({code:cloudCode,title,data:state,updated_at:new Date().toISOString()},{onConflict:'code'});
  if(error)throw error;try{localStorage.setItem(KEY+':code',cloudCode);}catch(e){}history.replaceState(null,'',`?p=${cloudCode}`);showCode();
  toast(`클라우드에 저장됨 · 코드 ${cloudCode}`);}catch(err){console.error(err);alert('클라우드 저장 실패: '+(err.message||err));}b.disabled=false;}
async function cloudOpen(code,silent){if(!sb)return false;try{const {data,error}=await sb.from(TABLE).select('data').eq('code',code).maybeSingle();if(error)throw error;
  if(!data){if(!silent)alert('해당 코드의 작업을 찾을 수 없습니다.');return false;}
  state=data.data;state.size=state.size||{w:1080,h:1350};state.fonts=state.fonts||[];registerFonts();cloudCode=code;try{localStorage.setItem(KEY+':code',code);}catch(e){}history.replaceState(null,'',`?p=${code}`);cur=0;selId=null;commit();renderAll();showCode();toast('클라우드에서 불러왔어요');return true;}
  catch(err){console.error(err);if(!silent)alert('불러오기 실패: '+(err.message||err));return false;}}
$('#bCloudSave').onclick=cloudSave;
$('#bCloudOpen').onclick=async()=>{const c=prompt('작업 코드를 입력하세요 (예: ABCD2345)',cloudCode||'');if(!c)return;await cloudOpen(c.trim().toUpperCase());};
/* ---------- boot ---------- */
function renderAll(){$('#selSize').value=`${W()}x${H()}`;renderLeft();renderStage();renderRight();}
load();registerFonts();hist=[snap()];hptr=0;showCode();
document.fonts.ready.then(renderAll);renderAll();
(async()=>{try{const u=new URL(location.href).searchParams.get('p');if(u&&sb)await cloudOpen(u.toUpperCase(),true);}catch(e){}})();
</script></body></html>
